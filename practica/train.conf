[data]
input = data/processed/videos.csv

[training]
seed = 42
max_rows = 6000
final_rows = 30000
test_rows = 8000
folds = 3
cluster_rows = 6000
recommend_rows = 10000
refinement_trials = 12

[output]
category = artifacts/category.pkl
comments_disabled = artifacts/comments.pkl
ratings_disabled = artifacts/ratings.pkl
likes = artifacts/likes.pkl
ratio = artifacts/ratio.pkl
cluster = artifacts/cluster.pkl
recommend = artifacts/recommend.pkl
reports = reports

[model:category]
family = svm
params = {"estimator__C": 1.0, "estimator__max_iter": 30000, "estimator__class_weight": "balanced", "features__text__max_features": 8000, "features__text__min_df": 2, "features__text__ngram_range": [1, 1], "features__text__sublinear_tf": true}
threshold = null

[model:comments_disabled]
family = svm
params = {"estimator__C": 3.0, "estimator__max_iter": 30000, "estimator__class_weight": null, "features__text__max_features": 16000, "features__text__min_df": 2, "features__text__ngram_range": [1, 1], "features__text__sublinear_tf": true}
threshold = -0.455780486242063

[model:ratings_disabled]
family = logistic
params = {"estimator__C": 1.0, "features__text__ngram_range": [1, 1], "estimator__max_iter": 3000, "estimator__class_weight": "balanced", "features__text__max_features": 8000, "features__text__min_df": 2, "features__text__sublinear_tf": true}
threshold = 0.579414198485685

[model:likes]
family = svr_log_target
params = {"estimator__regressor__C": 0.1, "estimator__regressor__max_iter": 60000, "features__text__max_features": 16000, "features__text__min_df": 4, "features__text__ngram_range": [1, 2], "features__text__sublinear_tf": true}
threshold = null

[model:ratio]
family = ridge_log_target
params = {"estimator__regressor__alpha": 1.0, "features__text__ngram_range": [1, 1], "estimator__regressor__max_iter": null, "features__text__max_features": 8000, "features__text__min_df": 2, "features__text__sublinear_tf": true}
threshold = null

[model:cluster]
family = kmeans
params = {"dimensions": 15, "seed": 42}
threshold = null
k = 2

[model:recommend]
family = char_tfidf
params = {"analyzer": "char_wb", "ngram_range": [3, 5]}
threshold = null

